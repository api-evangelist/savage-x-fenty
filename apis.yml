aid: savage-x-fenty
name: Savage X Fenty
description: >-
  Savage X Fenty is a direct-to-consumer lingerie, intimates, sleepwear and loungewear
  brand co-founded by Rihanna in 2018 and operated as part of TechStyle Fashion Group.
  It sells through savagex.com and its own iOS and Android shopping apps on a membership
  model — Savage X Rewards — where members unlock member pricing and store credits, or
  "skip the month" between the 1st and 5th to avoid the charge. The commerce stack is a
  custom TechStyle backend fronted by Next.js and Builder.io, behind a Cloudflare edge,
  with an AWS API Gateway at gateway.savagex.com. Savage X Fenty publishes no public
  developer program, no API reference, and no machine-readable contract; its first-party
  API gateway and its engineering docs site are both closed to the public.
